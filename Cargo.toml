[package]
name = "async-covariance"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Incremental covariance moments for asynchronous observations"
repository = "https://github.com/epicycloids/async-covariance"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py310"] }
numpy = "0.29.0"
rayon = "=1.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
