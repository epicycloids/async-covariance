[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "async-covariance"
version = "0.1.0"
description = "Incremental covariance moments for asynchronous observations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Logan Bell"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/epicycloids/async-covariance"

[tool.maturin]
python-source = "python"
module-name = "async_covariance._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
